<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Valle de Tamo - Edición Especial Vanessa</title>
    <!-- Fuente Pixel Art Retro -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <!-- Librería JSZip -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body {
            background-color: #050508;
            color: #ffffff;
            font-family: 'Press Start 2P', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Envoltorio del Juego Responsive */
        #game-container {
            position: relative;
            width: 100vw;
            max-width: 512px;
            height: 56vh;
            max-height: 384px;
            background: #000;
            border: 4px solid #2d323f;
            border-radius: 8px;
            box-shadow: 0 0 25px rgba(255, 119, 170, 0.3);
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* Cuadro de Diálogo Estilo RPG Clásico */
        #dialog-box {
            position: absolute;
            bottom: 8px;
            left: 8px;
            right: 8px;
            background: rgba(10, 10, 18, 0.95);
            border: 3px solid #ff77aa;
            border-radius: 6px;
            padding: 10px;
            font-size: 8px;
            line-height: 1.6;
            color: #fff;
            display: none;
            box-shadow: inset 0 0 0 2px #000, 0 4px 10px rgba(0,0,0,0.8);
            z-index: 10;
        }

        .dialog-speaker {
            color: #ff77aa;
            margin-bottom: 6px;
            text-transform: uppercase;
            font-size: 9px;
            text-shadow: 0 0 4px rgba(255, 119, 170, 0.5);
        }

        /* Controles Táctiles para Móvil */
        #controls {
            width: 100vw;
            max-width: 512px;
            height: 38vh;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: #0b0d12;
            border-top: 2px solid #1a1d24;
        }

        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 48px);
            grid-template-rows: repeat(3, 48px);
            gap: 3px;
        }

        .btn-pad {
            background: #1c202b;
            border: 2px solid #3a4154;
            color: #fff;
            font-family: 'Press Start 2P', monospace;
            font-size: 12px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 0 #0f1117;
        }

        .btn-pad:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #0f1117;
            background: #ff77aa;
            color: #000;
        }

        .action-container {
            display: flex;
            gap: 12px;
        }

        .btn-action {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: #ff77aa;
            border: 3px solid #fff;
            color: #000;
            font-family: 'Press Start 2P', monospace;
            font-size: 11px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 0 #aa4477;
        }

        .btn-action:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #aa4477;
            background: #ff99cc;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="256" height="192"></canvas>
        
        <div id="dialog-box">
            <div class="dialog-speaker" id="dialog-speaker">PERSONAJE</div>
            <div id="dialog-text">Texto de aventura...</div>
        </div>
    </div>

    <!-- Controles táctiles estilo Consola Portátil -->
    <div id="controls">
        <div class="dpad">
            <div></div>
            <button class="btn-pad" id="btn-up">▲</button>
            <div></div>
            <button class="btn-pad" id="btn-left">◄</button>
            <div></div>
            <button class="btn-pad" id="btn-right">►</button>
            <div></div>
            <button class="btn-pad" id="btn-down">▼</button>
            <div></div>
        </div>

        <div class="action-container">
            <button class="btn-action" id="btn-a">A</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;

        const dialogBox = document.getElementById('dialog-box');
        const dialogSpeaker = document.getElementById('dialog-speaker');
        const dialogText = document.getElementById('dialog-text');

        // Sintetizador de audio retro para efectos de sonido 8-bit
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(freq, duration) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        // Registro de Texturas extraídas de tus 15 ZIPs
        const textures = {};
        const zipList = [
            "House_1_Wood_Base_Blue.zip",
            "Oak_Tree_Small.zip",
            "Fences.zip",
            "Path_Tile.zip",
            "FarmLand_Tile.zip",
            "Chicken.zip",
            "Cow.zip",
            "Pig.zip",
            "Sheep.zip",
            "Bridge_Wood.zip",
            "Water_Tile.zip",
            "Cliff_Tile.zip",
            "Skeleton.zip",
            "Slime_Green.zip",
            "Chest.zip"
        ];

        let gameState = 'INTRO'; // 'INTRO' -> 'EXPLOSION' -> 'PLAY'
        let particles = [];
        let bannerTimer = 0;

        // Entidades y Jugador
        const player = {
            x: 40,
            y: 85,
            w: 16,
            h: 16,
            speed: 1.2
        };

        // Animales con movimiento dinámico
        const animals = [
            { type: 'chicken', x: 95, y: 125, vx: 0.2, vy: 0, timer: 0 },
            { type: 'cow', x: 110, y: 130, vx: 0, vy: 0.15, timer: 0 },
            { type: 'pig', x: 92, y: 140, vx: -0.15, vy: 0, timer: 0 },
            { type: 'sheep', x: 120, y: 142, vx: 0.1, vy: 0.1, timer: 0 }
        ];

        const inputs = { up: false, down: false, left: false, right: false };

        // Extractor de ZIPs transparente
        async function loadAssets() {
            for (let zipName of zipList) {
                try {
                    const res = await fetch(zipName);
                    if (!res.ok) continue;
                    const blob = await res.blob();
                    const zip = new JSZip();
                    const zipContent = await zip.loadAsync(blob);

                    for (let path in zipContent.files) {
                        const file = zipContent.files[path];
                        if (!file.dir && /\.(png|jpg)$/i.test(file.name)) {
                            const imgBlob = await file.async("blob");
                            const url = URL.createObjectURL(imgBlob);
                            const img = new Image();
                            img.src = url;
                            await new Promise(r => img.onload = r);
                            
                            const keyName = zipName.replace('.zip', '').toLowerCase();
                            const fileName = file.name.split('/').pop().toLowerCase();
                            textures[keyName] = img;
                            textures[fileName] = img;
                        }
                    }
                } catch (e) {}
            }
        }

        // Renderizado de Sprite con fallback de Pixel Art Dibujado
        function drawSprite(key, x, y, w, h, customDrawFunc) {
            const img = textures[key.toLowerCase()];
            if (img && img.complete) {
                ctx.drawImage(img, x, y, w, h);
            } else if (customDrawFunc) {
                customDrawFunc(x, y, w, h);
            }
        }

        // Transición de Explosión de Píxeles
        function triggerPixelExplosion() {
            playSound(523, 0.15);
            gameState = 'EXPLOSION';
            particles = [];
            for (let i = 0; i < 200; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 7,
                    vy: (Math.random() - 0.5) * 7,
                    size: Math.random() * 4 + 2,
                    color: ['#ff77aa', '#58a6ff', '#3fb950', '#d29922', '#ffffff'][Math.floor(Math.random() * 5)],
                    life: 1.0
                });
            }
        }

        // Actualizar posición de animales en la granja
        function updateAnimals() {
            animals.forEach(a => {
                a.timer++;
                if (a.timer > 60 + Math.random() * 60) {
                    a.timer = 0;
                    a.vx = (Math.random() - 0.5) * 0.3;
                    a.vy = (Math.random() - 0.5) * 0.3;
                }
                a.x += a.vx;
                a.y += a.vy;

                // Mantener dentro del área de la granja
                a.x = Math.max(88, Math.min(132, a.x));
                a.y = Math.max(120, Math.min(150, a.y));
            });
        }

        // Renderizado del Mapa 2D Completo
        function renderWorld() {
            // Fondo Verde (Pradera)
            ctx.fillStyle = "#1b4332";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 1. Caminos y Suelo (Path_Tile / Water_Tile / Cliff_Tile)
            for (let x = 0; x < canvas.width; x += 16) {
                drawSprite("path_tile", x, 80, 16, 16, (x, y, w, h) => {
                    ctx.fillStyle = "#3d2b1f"; ctx.fillRect(x, y, w, h);
                });
            }
            
            // Río y Puente (Water_Tile / Bridge_Wood)
            for (let y = 0; y < canvas.height; y += 16) {
                drawSprite("water_tile", 180, y, 16, 16, (x, y, w, h) => {
                    ctx.fillStyle = "#1d4ed8"; ctx.fillRect(x, y, w, h);
                });
            }
            drawSprite("bridge_wood", 176, 76, 24, 24, (x, y, w, h) => {
                ctx.fillStyle = "#854d0e"; ctx.fillRect(x, y, w, h);
            });

            // 2. Acantilados al norte (Cliff_Tile)
            for (let x = 0; x < canvas.width; x += 16) {
                drawSprite("cliff_tile", x, 0, 16, 16, (x, y, w, h) => {
                    ctx.fillStyle = "#475569"; ctx.fillRect(x, y, w, h);
                });
            }

            // 3. Cabaña Azul (House_1_Wood_Base_Blue) y Gran Biblioteca al Este
            drawSprite("house_1_wood_base_blue", 20, 20, 48, 48, (x, y, w, h) => {
                ctx.fillStyle = "#2563eb"; ctx.fillRect(x, y + 16, w, h - 16);
                ctx.fillStyle = "#dc2626"; ctx.beginPath(); ctx.moveTo(x, y + 16); ctx.lineTo(x + w/2, y); ctx.lineTo(x + w, y + 16); ctx.fill();
            });

            // Árboles y Cercas (Oak_Tree_Small / Fences)
            drawSprite("oak_tree_small", 85, 20, 24, 32, (x, y, w, h) => {
                ctx.fillStyle = "#15803d"; ctx.beginPath(); ctx.arc(x + 12, y + 12, 12, 0, Math.PI*2); ctx.fill();
            });
            drawSprite("oak_tree_small", 120, 20, 24, 32, (x, y, w, h) => {
                ctx.fillStyle = "#15803d"; ctx.beginPath(); ctx.arc(x + 12, y + 12, 12, 0, Math.PI*2); ctx.fill();
            });
            drawSprite("fences", 85, 115, 55, 12, (x, y, w, h) => {
                ctx.fillStyle = "#a16207"; ctx.fillRect(x, y, w, 4);
            });

            // 4. Granja y Parcelas Cultivables (FarmLand_Tile)
            drawSprite("farmland_tile", 88, 120, 48, 32, (x, y, w, h) => {
                ctx.fillStyle = "#78350f"; ctx.fillRect(x, y, w, h);
            });

            // Animales Animados en Movimiento
            animals.forEach(a => {
                drawSprite(a.type, a.x, a.y, 12, 12, (x, y) => {
                    ctx.fillStyle = a.type === 'chicken' ? '#fde047' : (a.type === 'cow' ? '#ffffff' : '#f472b6');
                    ctx.fillRect(x, y, 10, 10);
                });
            });

            // 5. Objetos Especiales: Lata de Monster Energética y Gatos
            ctx.fillStyle = "#22c55e"; // Lata de Monster Verde Flotante
            let floatY = Math.sin(Date.now() * 0.005) * 2;
            ctx.fillRect(150, 72 + floatY, 8, 12);
            ctx.fillStyle = "#fff";
            ctx.font = "6px 'Press Start 2P'";
            ctx.fillText("M", 151, 80 + floatY);

            // Gatos Guardianes
            ctx.fillStyle = "#f97316";
            ctx.fillRect(30, 72, 8, 8); // Gato junto a la cabaña

            // 6. Enemigos / Guardianes del Valle (Slime_Green / Skeleton)
            drawSprite("slime_green", 140, 82, 12, 12, (x, y) => {
                ctx.fillStyle = "#4ade80"; ctx.beginPath(); ctx.arc(x+6, y+6, 6, 0, Math.PI*2); ctx.fill();
            });
            drawSprite("skeleton", 220, 65, 14, 18, (x, y) => {
                ctx.fillStyle = "#f8fafc"; ctx.fillRect(x, y, 12, 16);
            });

            // 7. Cofre Legendario (Chest)
            drawSprite("chest", 220, 82, 16, 16, (x, y, w, h) => {
                ctx.fillStyle = "#eab308"; ctx.fillRect(x, y, w, h);
            });

            // 8. Jugador (Princesa)
            ctx.fillStyle = "#ff77aa";
            ctx.fillRect(player.x + 2, player.y + 2, 12, 12);
            ctx.fillStyle = "#fff";
            ctx.font = "8px 'Press Start 2P'";
            ctx.fillText("👑", player.x, player.y + 10);
        }

        // Bucle Principal
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (gameState === 'INTRO') {
                // Pantalla Mística de Inicio
                ctx.fillStyle = "#050508";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#ff77aa";
                ctx.font = "8px 'Press Start 2P'";
                ctx.textAlign = "center";
                ctx.fillText("¿QUIÉN ERES?", canvas.width / 2, 60);

                ctx.fillStyle = "#8b949e";
                ctx.font = "6px 'Press Start 2P'";
                ctx.fillText("El destino del valle despierta...", canvas.width / 2, 90);

                ctx.fillStyle = "#ffffff";
                let pulse = Math.abs(Math.sin(Date.now() * 0.004));
                ctx.globalAlpha = pulse;
                ctx.fillText("[ TOCA PARA COMENZAR ]", canvas.width / 2, 140);
                ctx.globalAlpha = 1.0;

            } else if (gameState === 'EXPLOSION') {
                // Explosión de Píxeles
                ctx.fillStyle = "#000";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                let alive = false;
                for (let p of particles) {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life -= 0.02;
                    if (p.life > 0) {
                        alive = true;
                        ctx.fillStyle = p.color;
                        ctx.fillRect(p.x, p.y, p.size, p.size);
                    }
                }

                if (!alive) {
                    gameState = 'PLAY';
                    bannerTimer = 180;
                }

            } else if (gameState === 'PLAY') {
                updatePlayer();
                updateAnimals();
                renderWorld();

                // Banner Flotante de Bienvenida
                if (bannerTimer > 0) {
                    bannerTimer--;
                    ctx.fillStyle = "rgba(10, 10, 18, 0.85)";
                    ctx.fillRect(8, 8, canvas.width - 16, 26);
                    ctx.strokeStyle = "#ff77aa";
                    ctx.strokeRect(8, 8, canvas.width - 16, 26);

                    ctx.fillStyle = "#ff77aa";
                    ctx.font = "6px 'Press Start 2P'";
                    ctx.textAlign = "center";
                    ctx.fillText("BIENVENIDA AL VALLE DE TAMO", canvas.width / 2, 24);
                }
            }

            requestAnimationFrame(gameLoop);
        }

        // Movimiento del Jugador
        function updatePlayer() {
            if (inputs.up) player.y -= player.speed;
            if (inputs.down) player.y += player.speed;
            if (inputs.left) player.x -= player.speed;
            if (inputs.right) player.x += player.speed;

            player.x = Math.max(0, Math.min(canvas.width - 16, player.x));
            player.y = Math.max(0, Math.min(canvas.height - 16, player.y));
        }

        // Sistema de Interacción y Diálogos Reales
        function interact() {
            playSound(440, 0.1);
            if (gameState === 'INTRO') {
                triggerPixelExplosion();
                return;
            }

            if (gameState === 'PLAY') {
                const distChest = Math.hypot(player.x - 220, player.y - 82);
                const distHouse = Math.hypot(player.x - 35, player.y - 35);
                const distMonster = Math.hypot(player.x - 150, player.y - 75);

                dialogBox.style.display = "block";

                if (distChest < 25) {
                    dialogSpeaker.innerText = "👑 COFRE DE CUMPLEAÑOS (7 DE OCTUBRE)";
                    dialogText.innerText = "¡Feliz Cumpleaños Princesa! Que hoy cada estrella brille a tu favor, que nunca te falte la energía para conquistar tus metas, la paz de una buena lectura en tu biblioteca secreta, las risas con tus amigas y la certeza de que hay alguien que cuida cada uno de tus pasos con todo el cariño del mundo.";
                } else if (distMonster < 25) {
                    dialogSpeaker.innerText = "⚡ ELIXIR MONSTER ENERGÉTICA";
                    dialogText.innerText = "Una bebida legendaria que otorga concentración y energía infinita a la Princesa para sus aventuras.";
                } else if (distHouse < 35) {
                    dialogSpeaker.innerText = "🏠 EL HOGAR DEL ALBA";
                    dialogText.innerText = "Tu acogedora casa de madera azul en el valle. Un refugio seguro lleno de calidez y paz.";
                } else {
                    dialogSpeaker.innerText = "📜 EXPLORACIÓN DEL VALLE";
                    dialogText.innerText = "Cruza el puente de madera hacia el este y acércate al Cofre Dorado para abrir tu sorpresa.";
                }
            }
        }

        // Vincular Controles Táctiles y Teclado
        function bindTouch(btnId, key) {
            const btn = document.getElementById(btnId);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); inputs[key] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); inputs[key] = false; });
            btn.addEventListener('mousedown', () => inputs[key] = true);
            btn.addEventListener('mouseup', () => inputs[key] = false);
        }

        bindTouch('btn-up', 'up');
        bindTouch('btn-down', 'down');
        bindTouch('btn-left', 'left');
        bindTouch('btn-right', 'right');

        window.addEventListener('keydown', e => {
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') inputs.up = true;
            if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') inputs.down = true;
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') inputs.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') inputs.right = true;
            if (e.key === ' ' || e.key === 'Enter' || e.key === 'e' || e.key === 'E') interact();
        });

        window.addEventListener('keyup', e => {
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') inputs.up = false;
            if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') inputs.down = false;
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') inputs.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') inputs.right = false;
        });

        document.getElementById('btn-a').addEventListener('click', interact);
        canvas.addEventListener('click', () => {
            if (gameState === 'INTRO') triggerPixelExplosion();
        });

        // Cargar Recursos e Iniciar
        loadAssets();
        gameLoop();
    </script>
</body>
</html>
