<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para Vanessa - Mi Compañera de Vida</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Quicksand:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #020205; font-family: 'Quicksand', sans-serif; }

        /* Contenedor del fondo animado */
        #background-canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
            transition: background 2s ease;
        }

        /* Capa oscura para dar contraste al texto */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.85) 100%);
            z-index: 2; pointer-events: none;
        }

        /* Contenedor principal de la historia */
        #story-container {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 10; width: 90%; max-width: 650px; display: flex; flex-direction: column; align-items: center;
        }

        /* La "tarjeta" de cristal donde aparece el texto */
        .glass-panel {
            width: 100%; padding: 40px 30px; background: rgba(15, 15, 25, 0.4);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 119, 170, 0.2); border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(255, 119, 170, 0.05);
            text-align: center; color: #fff;
            opacity: 0; transform: translateY(20px); transition: all 1s ease;
            max-height: 80vh; display: flex; flex-direction: column;
        }

        .glass-panel.active { opacity: 1; transform: translateY(0); }

        h1 { 
            font-family: 'Cinzel', serif; font-size: 24px; color: #ff99cc; 
            margin-bottom: 20px; text-shadow: 0 0 15px rgba(255, 119, 170, 0.5); 
            letter-spacing: 1px; flex-shrink: 0;
        }

        /* Contenedor de texto con scroll para textos largos */
        #text-content {
            overflow-y: auto; padding-right: 10px; font-weight: 400;
            /* Scrollbar styling */
            scrollbar-width: thin; scrollbar-color: rgba(255, 119, 170, 0.5) transparent;
        }
        #text-content::-webkit-scrollbar { width: 6px; }
        #text-content::-webkit-scrollbar-track { background: transparent; }
        #text-content::-webkit-scrollbar-thumb { background: rgba(255, 119, 170, 0.5); border-radius: 10px; }

        p { font-size: 17px; line-height: 1.8; color: #e2e8f0; margin-bottom: 20px; text-align: justify; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        p:last-child { margin-bottom: 0; }

        /* Botón para avanzar en la historia */
        .next-btn {
            margin-top: 30px; padding: 12px 35px; font-family: 'Cinzel', serif; font-size: 15px; font-weight: 600;
            color: #fff; background: linear-gradient(45deg, transparent, rgba(255, 119, 170, 0.2), transparent); 
            border: 1px solid #ff77aa; border-radius: 30px;
            cursor: pointer; transition: all 0.4s ease; text-transform: uppercase; letter-spacing: 2px;
            box-shadow: 0 0 15px rgba(255, 119, 170, 0.3); outline: none; flex-shrink: 0;
        }

        .next-btn:hover { background: rgba(255, 119, 170, 0.3); box-shadow: 0 0 25px rgba(255, 119, 170, 0.6); transform: scale(1.05); }

        .click-particle {
            position: absolute; width: 8px; height: 8px; background: #fff; border-radius: 50%;
            pointer-events: none; z-index: 20; box-shadow: 0 0 12px #ff77aa;
            animation: explode 0.6s ease-out forwards;
        }
        @keyframes explode { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(3.5); opacity: 0; } }

        .signature { font-family: 'Cinzel', serif; color: #ff77aa; margin-top: 30px; font-style: italic; font-size: 18px; display: none; text-align: right; }
    </style>
</head>
<body>

    <canvas id="background-canvas"></canvas>
    <div class="overlay"></div>

    <div id="story-container">
        <div class="glass-panel" id="panel">
            <h1 id="title">Para ti...</h1>
            <div id="text-content">
                <p>Toca el botón de abajo para comenzar a leer.</p>
            </div>
            <div class="signature" id="signature">Con todo mi infinito amor,<br>Tu programador favorito</div>
            <button class="next-btn" id="nextBtn">Comenzar</button>
        </div>
    </div>

    <script>
        // --- SISTEMA DE FONDOS GENERATIVOS ---
        const canvas = document.getElementById('background-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let elements = [];
        let currentScene = 0;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            createElements();
        }

        function createElements() {
            elements = [];
            if (currentScene <= 1) {
                // Cielo estrellado profundo y tranquilo
                for (let i = 0; i < 180; i++) {
                    elements.push({ x: Math.random() * width, y: Math.random() * height, s: Math.random() * 1.5, a: Math.random(), vx: 0, vy: 0, type: 'star' });
                }
            } else if (currentScene === 2) {
                // Luces cálidas ascendentes (Representa la compañía y salir de la soledad)
                for (let i = 0; i < 120; i++) {
                    elements.push({ x: Math.random() * width, y: Math.random() * height, s: Math.random() * 2.5 + 1, a: Math.random() * 0.5 + 0.1, vx: Math.random() * 0.4 - 0.2, vy: Math.random() * -1.5 - 0.5, type: 'warm-light' });
                }
            } else {
                // Lluvia de luz dorada y rosada (Celebración inmensa)
                for (let i = 0; i < 250; i++) {
                    elements.push({ x: Math.random() * width, y: Math.random() * height, s: Math.random() * 2, a: Math.random(), vx: Math.random() * 1 - 0.5, vy: Math.random() * 2 + 1, type: 'magic' });
                }
            }
        }

        function drawBackground() {
            const bgColors = [
                '#020205', // Noche profunda
                '#050a15', // Azul muy oscuro
                '#100a1c', // Púrpura oscuro
                '#1a0b12', // Tono rojizo/rosado romántico
                '#1c0b15'  // Tono cálido final
            ];
            
            ctx.fillStyle = bgColors[currentScene] || '#1c0b15';
            ctx.fillRect(0, 0, width, height);

            elements.forEach(e => {
                if (e.type === 'star') {
                    e.a += (Math.random() - 0.5) * 0.05; e.a = Math.max(0.1, Math.min(1, e.a));
                    ctx.fillStyle = `rgba(255, 255, 255, ${e.a})`;
                } else if (e.type === 'warm-light') {
                    e.y += e.vy; e.x += e.vx; if (e.y < -10) { e.y = height + 10; e.x = Math.random() * width; }
                    ctx.fillStyle = `rgba(255, 200, 150, ${e.a})`;
                } else if (e.type === 'magic') {
                    e.y += e.vy; e.x += e.vx; if (e.y > height + 10) { e.y = -10; e.x = Math.random() * width; }
                    ctx.fillStyle = Math.random() > 0.5 ? `rgba(255, 119, 170, ${e.a})` : `rgba(255, 215, 0, ${e.a})`;
                }
                ctx.beginPath(); ctx.arc(e.x, e.y, e.s, 0, Math.PI * 2); ctx.fill();
            });
            requestAnimationFrame(drawBackground);
        }

        window.addEventListener('resize', resize);
        resize();
        drawBackground();

        // --- SISTEMA DE LA CARTA (NARRATIVA) ---
        const story = [
            {
                title: "Nuestra Primera Conexión",
                text: "<p>Aún recuerdo ese primer día en el que comenzamos a hablar. Fue como si de repente el universo alineara las piezas correctas de un rompecabezas que no sabía que estaba armando.</p><p>Conectamos de una manera que nunca imaginé posible, simplemente porque éramos increíblemente parecidos. Descubrimos que nos apasionaban los mismos libros, que disfrutábamos de las mismas cosas y, de alguna forma mágica, sentí que hablábamos exactamente el mismo idioma.</p><p>Hasta compartíamos ese amor incondicional por la misma bebida, nuestra infaltable Monster. Cada charla era, y sigue siendo, descubrir un pedacito de mí reflejado en ti.</p>",
                btn: "Siguiente"
            },
            {
                title: "Mi Compañía en el Mundo",
                text: "<p>Conocerte fue, sin lugar a dudas, una de las experiencias más hermosas e inesperadas que me ha regalado la vida.</p><p>Antes de ti, a veces sentía que caminaba a solas por este mundo, que no encajaba del todo. Pero tú llegaste para cambiarlo todo. Me ayudaste a entender que ya no estaba solo, que había encontrado a alguien que me comprende de verdad.</p><p>Te convertiste en mi refugio, en la compañía perfecta que siempre estuve buscando sin saberlo. Contigo, los días tienen otro color y hasta el silencio se siente cómodo.</p>",
                btn: "Continuar"
            },
            {
                title: "Una Pequeña Confesión",
                text: "<p>Hoy es un día inmensamente importante, y quería darte algo diferente, algo gigante. Mi plan original era crear y programar un juego completo solo para ti, para que lo exploraras.</p><p>Pero, siendo muy sincero, me topé con muchos problemas técnicos en el código a último momento. Lo intenté con todas mis fuerzas, pero no quería que esos errores arruinaran tu cumpleaños ni entregarte algo a medias.</p><p>Por eso, preferí usar mi experiencia y todo lo que sé hacer para programar de cero este rincón especial para ti. No es el gran juego que imaginé en un principio, pero cada línea de código de esta carta, cada estrella de este fondo, fue escrita pensando única y exclusivamente en ti, con todo mi amor.</p>",
                btn: "Leer el mensaje final"
            },
            {
                title: "Feliz Cumpleaños, Mi Vida",
                text: "<p>Hoy, 7 de octubre, el mundo entero debería celebrar, porque es el día en que naciste y el universo se volvió un lugar muchísimo más hermoso.</p><p>Quiero desearte el más feliz de los cumpleaños, Vanessa. Eres una mujer maravillosa, llena de luz, y tienes una magia que me cautiva un poco más todos los días. Admiro profundamente tu forma de ser, tu inteligencia y esa chispa única que te hace ser tú.</p><p>Quiero que sepas que siempre, pase lo que pase, voy a estar aquí para ti. Para apoyarte en cada locura, para celebrar tus triunfos por más pequeños que sean, y para sostenerte fuertemente la mano en los días grises.</p><p>Deseo desde lo más profundo de mi corazón que este nuevo año de vida te traiga infinitas alegrías, que logres todas esas metas que tienes en tu mente, y que nunca te falten motivos para sonreír (ni tampoco latas de Monster en la nevera para nuestras charlas).</p><p>Perdóname si este regalo tuvo que cambiar de forma y no fue el juego perfecto, pero te prometo que el amor que siento por ti sí es perfecto, y crece con cada segundo que tengo la suerte de pasar a tu lado.</p><p>Gracias por existir, gracias por cruzarte en mi camino, por ser mi compañera, mi cómplice y mi amor. Disfruta tu día al máximo, te lo mereces todo en este mundo.</p><p>Te amo muchísimo, Vanessa. Hoy y siempre.</p>",
                btn: "Finalizar"
            }
        ];

        let currentStep = -1;
        const panel = document.getElementById('panel');
        const titleEl = document.getElementById('title');
        const textEl = document.getElementById('text-content');
        const btnEl = document.getElementById('nextBtn');
        const sigEl = document.getElementById('signature');

        function updateStory() {
            if (currentStep >= story.length) return;

            panel.classList.remove('active');

            setTimeout(() => {
                if (currentStep === story.length - 1) {
                    sigEl.style.display = 'block';
                    btnEl.style.display = 'none';
                }

                titleEl.innerHTML = story[currentStep].title;
                textEl.innerHTML = story[currentStep].text;
                btnEl.innerHTML = story[currentStep].btn;
                
                // Forzar el scroll al inicio cuando cambia el texto
                textEl.scrollTop = 0;
                
                currentScene = currentStep;
                createElements(); 

                panel.classList.add('active');
            }, 800);
        }

        btnEl.addEventListener('click', (e) => {
            currentStep++;
            updateStory();
            createClickEffect(e.clientX, e.clientY);
        });

        function createClickEffect(x, y) {
            const particle = document.createElement('div');
            particle.classList.add('click-particle');
            particle.style.left = x - 4 + 'px';
            particle.style.top = y - 4 + 'px';
            document.body.appendChild(particle);
            setTimeout(() => particle.remove(), 600);
        }

        setTimeout(() => panel.classList.add('active'), 500);

    </script>
</body>
</html>
