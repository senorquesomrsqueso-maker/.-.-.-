<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para Vanessa - Un Viaje Especial</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Quicksand:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #020205; font-family: 'Quicksand', sans-serif; }

        /* Contenedor del fondo animado */
        #background-canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
            transition: background 2s ease;
        }

        /* Capa oscura para dar contraste al texto */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.8) 100%);
            z-index: 2; pointer-events: none;
        }

        /* Contenedor principal de la historia */
        #story-container {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 10; width: 90%; max-width: 600px; display: flex; flex-direction: column; align-items: center;
        }

        /* La "tarjeta" de cristal donde aparece el texto */
        .glass-panel {
            width: 100%; padding: 40px; background: rgba(15, 15, 25, 0.4);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(255, 119, 170, 0.05);
            text-align: center; color: #fff;
            opacity: 0; transform: translateY(20px); transition: all 1s ease;
        }

        .glass-panel.active { opacity: 1; transform: translateY(0); }

        h1 { font-family: 'Cinzel', serif; font-size: 26px; color: #ff99cc; margin-bottom: 20px; text-shadow: 0 0 10px rgba(255, 119, 170, 0.4); letter-spacing: 1px; }
        p { font-size: 16px; line-height: 1.8; color: #e2e8f0; margin-bottom: 15px; }

        /* Botón para avanzar en la historia */
        .next-btn {
            margin-top: 30px; padding: 12px 30px; font-family: 'Cinzel', serif; font-size: 14px;
            color: #fff; background: transparent; border: 1px solid #ff77aa; border-radius: 25px;
            cursor: pointer; transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 2px;
            box-shadow: 0 0 15px rgba(255, 119, 170, 0.2); outline: none;
        }

        .next-btn:hover { background: rgba(255, 119, 170, 0.2); box-shadow: 0 0 25px rgba(255, 119, 170, 0.5); transform: scale(1.05); }

        /* Efecto de partículas brillantes que aparecen al hacer clic */
        .click-particle {
            position: absolute; width: 8px; height: 8px; background: #fff; border-radius: 50%;
            pointer-events: none; z-index: 20; box-shadow: 0 0 10px #ff77aa;
            animation: explode 0.6s ease-out forwards;
        }
        @keyframes explode {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(3); opacity: 0; }
        }

        .signature { font-family: 'Cinzel', serif; color: #ff77aa; margin-top: 25px; font-style: italic; font-size: 18px; display: none; }
    </style>
</head>
<body>

    <canvas id="background-canvas"></canvas>
    <div class="overlay"></div>

    <div id="story-container">
        <div class="glass-panel" id="panel">
            <h1 id="title">El Inicio...</h1>
            <div id="text-content">
                <p>Cargando el viaje...</p>
            </div>
            <div class="signature" id="signature">Con todo mi cariño,<br>Mr. Queso</div>
            <button class="next-btn" id="nextBtn">Comenzar</button>
        </div>
    </div>

    <script>
        // --- SISTEMA DE FONDOS GENERATIVOS (CÓDIGO PURO) ---
        const canvas = document.getElementById('background-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let elements = [];
        let currentScene = 0;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            createElements();
        }

        // Crear elementos dependiendo de la escena
        function createElements() {
            elements = [];
            if (currentScene === 0 || currentScene === 1) {
                // Escena 1 y 2: Estrellas estáticas y fugaces
                for (let i = 0; i < 150; i++) {
                    elements.push({
                        x: Math.random() * width, y: Math.random() * height,
                        s: Math.random() * 1.5, a: Math.random(),
                        vx: 0, vy: 0, type: 'star'
                    });
                }
            } else if (currentScene === 2) {
                // Escena 3: Ascensión (partículas subiendo, estilo Monster/Energía)
                for (let i = 0; i < 100; i++) {
                    elements.push({
                        x: Math.random() * width, y: Math.random() * height,
                        s: Math.random() * 3 + 1, a: Math.random() * 0.5 + 0.1,
                        vx: 0, vy: Math.random() * -2 - 0.5, type: 'bubble'
                    });
                }
            } else {
                // Escena final: Lluvia de luz dorada/rosada
                for (let i = 0; i < 200; i++) {
                    elements.push({
                        x: Math.random() * width, y: Math.random() * height,
                        s: Math.random() * 2, a: Math.random(),
                        vx: Math.random() * 1 - 0.5, vy: Math.random() * 2 + 1, type: 'light'
                    });
                }
            }
        }

        function drawBackground() {
            // Colores de fondo por escena
            const bgColors = [
                '#020205', // Noche profunda
                '#0a0a1a', // Noche estrellada
                '#0d1b2a', // Azul místico
                '#1a0b1c'  // Amanecer rosado/púrpura
            ];
            
            // Transición suave de fondo (simulada)
            ctx.fillStyle = bgColors[currentScene] || '#1a0b1c';
            ctx.fillRect(0, 0, width, height);

            elements.forEach(e => {
                if (e.type === 'star') {
                    e.a += (Math.random() - 0.5) * 0.05;
                    e.a = Math.max(0.1, Math.min(1, e.a));
                    ctx.fillStyle = `rgba(255, 255, 255, ${e.a})`;
                } else if (e.type === 'bubble') {
                    e.y += e.vy;
                    if (e.y < -10) e.y = height + 10;
                    ctx.fillStyle = `rgba(100, 255, 150, ${e.a})`; // Tono energético
                } else if (e.type === 'light') {
                    e.y += e.vy; e.x += e.vx;
                    if (e.y > height + 10) { e.y = -10; e.x = Math.random() * width; }
                    ctx.fillStyle = Math.random() > 0.5 ? `rgba(255, 119, 170, ${e.a})` : `rgba(255, 215, 0, ${e.a})`;
                }
                
                ctx.beginPath();
                ctx.arc(e.x, e.y, e.s, 0, Math.PI * 2);
                ctx.fill();
            });

            requestAnimationFrame(drawBackground);
        }

        window.addEventListener('resize', resize);
        resize();
        drawBackground();


        // --- SISTEMA DE LA HISTORIA (NARRATIVA VISUAL) ---
        const story = [
            {
                title: "Un Día Especial",
                text: "<p>Hay días en el calendario que pasan desapercibidos, pero luego hay fechas que el universo marca con un brillo distinto.</p><p>Hoy, 7 de octubre, es uno de esos días.</p>",
                btn: "Avanzar"
            },
            {
                title: "El Valle de Tamo",
                text: "<p>Sé que esperabas recorrer un mapa de plataformas, saltar y encontrar latas de Monster escondidas por ahí...</p><p>Pero a veces, las aventuras más bonitas no requieren saltos precisos, sino simplemente detenerse a observar lo increíble que eres.</p>",
                btn: "Continuar"
            },
            {
                title: "Tu Propia Magia",
                text: "<p>Admiro profundamente esa creatividad infinita que tienes. Esa capacidad tuya para construir mundos, escribir códigos y darle forma a cosas maravillosas de la nada.</p><p>Eres una mente brillante, Vanessa, pero sobre todo, una persona que ilumina la vida de quienes tienen la suerte de rodearte.</p>",
                btn: "Siguiente"
            },
            {
                title: "Feliz Cumpleaños",
                text: "<p>Así que, aunque no haya un 'Cofre Dorado' pixelado al final de un nivel de juego, este es mi tesoro para ti el día de hoy.</p><p>Que este nuevo año te traiga risas sinceras, éxitos en todo lo que te propongas, energía ilimitada y la absoluta certeza de que eres inmensamente valiosa.</p><p>Feliz cumpleaños, Vanessa.</p>",
                btn: "Finalizar"
            }
        ];

        let currentStep = -1;
        const panel = document.getElementById('panel');
        const titleEl = document.getElementById('title');
        const textEl = document.getElementById('text-content');
        const btnEl = document.getElementById('nextBtn');
        const sigEl = document.getElementById('signature');

        function updateStory() {
            if (currentStep >= story.length) return;

            // Ocultar panel suavemente
            panel.classList.remove('active');

            setTimeout(() => {
                if (currentStep === story.length - 1) {
                    // Última escena
                    sigEl.style.display = 'block';
                    btnEl.style.display = 'none';
                }

                titleEl.innerHTML = story[currentStep].title;
                textEl.innerHTML = story[currentStep].text;
                btnEl.innerHTML = story[currentStep].btn;
                
                currentScene = currentStep;
                createElements(); // Cambiar el fondo según la escena

                // Mostrar panel suavemente
                panel.classList.add('active');
            }, 800); // Espera a que termine la transición de opacidad
        }

        btnEl.addEventListener('click', (e) => {
            currentStep++;
            if (currentStep === 0) {
                // Primer clic, iniciar música si la hubiera, arrancar historia
                updateStory();
            } else {
                updateStory();
            }
            createClickEffect(e.clientX, e.clientY);
        });

        // Efecto visual al hacer clic
        function createClickEffect(x, y) {
            const particle = document.createElement('div');
            particle.classList.add('click-particle');
            particle.style.left = x - 4 + 'px';
            particle.style.top = y - 4 + 'px';
            document.body.appendChild(particle);
            setTimeout(() => particle.remove(), 600);
        }

        // Iniciar pantalla inicial
        setTimeout(() => panel.classList.add('active'), 500);

    </script>
</body>
</html>
